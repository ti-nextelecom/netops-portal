<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#050a12; display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; gap:30px; }
.logo-wrap { padding:40px; background:#080e1c; border:1px solid #162035; border-radius:16px; box-shadow:0 0 40px #00c8ff22; }
.variants { display:flex; gap:20px; flex-wrap:wrap; justify-content:center; }
.variant-label { color:#3a5070; font-family:sans-serif; font-size:12px; text-align:center; margin-bottom:8px; }
.dark { background:#050a12; padding:20px; border-radius:8px; }
.light { background:#f0f4f8; padding:20px; border-radius:8px; }

<div class="logo-wrap"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 200" width="460" height="200">
  <rect width="460" height="200" fill="#0d1117"/>

  <!-- ── TOP: 3 dendrite arms fan from Y-junction above body ── -->
  <line x1="64" y1="80" x2="42" y2="46" stroke="#4ecdc4" stroke-width="4" stroke-linecap="round"/>
  <line x1="64" y1="80" x2="64" y2="42" stroke="#4ecdc4" stroke-width="4" stroke-linecap="round"/>
  <line x1="64" y1="80" x2="86" y2="46" stroke="#4ecdc4" stroke-width="4" stroke-linecap="round"/>

  <!-- Teal diamond tips (UTP) -->
  <polygon points="42,38 50,46 42,54 34,46" fill="#4ecdc4"/>
  <polygon points="64,34 72,42 64,50 56,42" fill="#4ecdc4"/>
  <polygon points="86,38 94,46 86,54 78,46" fill="#4ecdc4"/>

  <!-- Body (soma) -->
  <rect x="50" y="80" width="28" height="28" rx="4" fill="#4ecdc4"/>

  <!-- ── AXON: L-shape — straight down then 90° right (circuit PCB style) ── -->
  <path d="M 64 108 L 64 132 L 112 132"
        stroke="#4ecdc4" stroke-width="4" fill="none"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ── BOTTOM: inverted Y-junction — 2 arms from axon endpoint ── -->
  <line x1="112" y1="132" x2="98"  y2="150" stroke="#4ecdc4" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="112" y1="132" x2="126" y2="150" stroke="#4ecdc4" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Amber diamond tips (F.O. — 2 connections at center) -->
  <polygon points="98,142 106,150 98,158 90,150" fill="#f0a000"/>
  <polygon points="126,142 134,150 126,158 118,150" fill="#f0a000"/>

  <!-- ── TEXT ── -->
  <text x="158" y="95"
        font-family="'Segoe UI','Arial',sans-serif"
        font-size="44" font-weight="700"
        fill="#e8f4ff" letter-spacing="-1">Synapse</text>

  <text x="161" y="120"
        font-family="'Segoe UI','Arial',sans-serif"
        font-size="13" font-weight="400"
        fill="#4ecdc4" letter-spacing="6">IoT BUILDER</text>
</svg>

<script>
(function(){
  var t = localStorage.getItem('netops_token');
  if (!t) { window.location.href = '/login'; return; }
  fetch('/api/auth/me', { headers: { Authorization: 'Bearer ' + t } })
    .then(function(r){ return r.json(); })
    .then(function(d){ if (!d.ok) { localStorage.clear(); window.location.href = '/login'; } })
    .catch(function(){ localStorage.clear(); window.location.href = '/login'; });
})();
</script>
