<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BGP Upstream Graph — NEX NetOps</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/x-icon" href="/favicon/favicon.ico">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',sans-serif;background:#1A222E;color:#fff;min-height:100vh;overflow:hidden}

.navbar{
  position:fixed;top:0;left:0;right:0;height:56px;z-index:200;
  background:rgba(15,20,28,0.97);backdrop-filter:blur(16px);
  border-bottom:1px solid rgba(255,102,0,0.15);
  display:flex;align-items:center;padding:0 1.5rem;gap:1rem;
}
.nav-brand{display:flex;align-items:center;gap:9px;text-decoration:none}
.nav-logo{width:30px;height:30px;filter:drop-shadow(0 0 6px rgba(255,102,0,0.4))}
.nav-title{font-size:14px;font-weight:700;color:#fff;letter-spacing:-.02em}
.nav-title span{color:#FF6600}
.nav-sep{color:rgba(255,255,255,0.2);font-size:16px;margin:0 4px}
.nav-page{font-size:13px;color:#929EB0;font-weight:500}
.nav-back{
  margin-left:auto;display:flex;align-items:center;gap:5px;
  font-size:12px;color:#929EB0;text-decoration:none;
  padding:5px 10px;border-radius:7px;transition:color .15s,background .15s;
}
.nav-back:hover{color:#fff;background:rgba(255,255,255,0.06)}

/* Floating toolbar */
.toolbar{
  position:fixed;top:68px;right:16px;z-index:100;
  display:flex;flex-direction:column;gap:6px;
}
.tb-btn{
  display:flex;align-items:center;gap:7px;
  padding:7px 12px;border-radius:8px;font-size:12px;font-weight:600;
  font-family:inherit;cursor:pointer;border:1px solid rgba(255,255,255,0.1);
  background:rgba(15,20,28,0.9);color:#929EB0;transition:all .15s;
  backdrop-filter:blur(8px);white-space:nowrap;
}
.tb-btn:hover{color:#fff;border-color:rgba(255,102,0,0.4);background:rgba(26,34,46,0.95)}
.tb-btn svg{flex-shrink:0}

/* Legend */
.legend{
  position:fixed;bottom:16px;left:16px;z-index:100;
  background:rgba(15,20,28,0.9);backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,0.08);border-radius:10px;
  padding:10px 14px;display:flex;flex-direction:column;gap:6px;
}
.leg-item{display:flex;align-items:center;gap:8px;font-size:11px;color:#929EB0}
.leg-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}

/* Info panel */
.info-panel{
  position:fixed;bottom:16px;right:16px;z-index:100;width:260px;
  background:rgba(15,20,28,0.95);backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,0.1);border-radius:12px;
  padding:1rem;display:none;
}
.info-panel.show{display:block}
.info-title{font-size:16px;font-weight:700;color:#FF6600;margin-bottom:4px}
.info-name{font-size:13px;color:#CBD5E0;margin-bottom:10px;line-height:1.4}
.info-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid rgba(255,255,255,0.05)}
.info-row:last-child{border-bottom:none}
.info-key{font-size:10px;color:#4A5568;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.info-val{font-size:12px;color:#CBD5E0;text-align:right;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.info-close{position:absolute;top:10px;right:10px;background:none;border:none;color:#4A5568;cursor:pointer;font-size:16px;line-height:1}
.info-close:hover{color:#929EB0}
.info-badge{
  display:inline-block;padding:2px 8px;border-radius:4px;font-size:10px;font-weight:700;
  letter-spacing:.05em;margin-top:6px;
}

/* Loading overlay */
.loading{
  position:fixed;inset:0;top:56px;z-index:50;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  background:rgba(26,34,46,0.7);backdrop-filter:blur(4px);
}
.loading.hidden{display:none}
.spinner{
  width:36px;height:36px;border-radius:50%;
  border:3px solid rgba(255,102,0,0.15);
  border-top-color:#FF6600;
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{font-size:13px;color:#929EB0}

/* Error */
.error-box{
  position:fixed;top:68px;left:50%;transform:translateX(-50%);z-index:150;
  background:rgba(200,50,50,0.15);border:1px solid rgba(200,50,50,0.3);
  border-radius:10px;padding:12px 20px;font-size:13px;color:#FC8181;
  display:none;max-width:500px;text-align:center;
}
.error-box.show{display:block}

/* Stats bar */
.stats-bar{
  position:fixed;top:68px;left:16px;z-index:100;
  display:flex;gap:8px;
}
.stat-chip{
  background:rgba(15,20,28,0.9);backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,0.08);border-radius:7px;
  padding:5px 10px;font-size:11px;color:#929EB0;
}
.stat-chip strong{color:#fff;margin-left:4px}

/* SVG */
#graph{width:100vw;height:calc(100vh - 56px);display:block;margin-top:56px}

/* Node tooltip styles applied via D3 */
</style>
</head>
<body>

<nav class="navbar">
  <a class="nav-brand" href="/">
    <svg class="nav-logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
      <defs>
        <linearGradient id="og" x1="0" y1="0" x2="0.4" y2="1"><stop offset="0%" stop-color="#FF3500"/><stop offset="100%" stop-color="#FF7A00"/></linearGradient>
        <linearGradient id="bl" x1="1" y1="0" x2="0.2" y2="1"><stop offset="0%" stop-color="#0A44B0"/><stop offset="100%" stop-color="#2978FF"/></linearGradient>
      </defs>
      <rect width="100" height="100" rx="22" fill="#0B1221"/>
      <path fill="url(#bl)" d="M33 24 L65 24 L84 50 L65 76 L54 76 L60 90 L47 76 L33 76 L14 50 Z"/>
      <path fill="url(#og)" d="M70 17 L40 17 L17 50 L30 50 L45 30 L70 30 Z"/>
      <path fill="url(#og)" d="M17 50 L40 83 L50 83 L44 97 L37 83 L70 83 L70 70 L45 70 L30 50 Z"/>
      <circle cx="37" cy="50" r="4.2" fill="#FF6600"/>
      <circle cx="50" cy="50" r="4.2" fill="#7040C0"/>
      <circle cx="63" cy="50" r="4.2" fill="#2978FF"/>
    </svg>
    <span class="nav-title">NEX <span>NetOps</span></span>
  </a>
  <span class="nav-sep">/</span>
  <span class="nav-page">BGP Upstream Graph</span>
  <a class="nav-back" href="/">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
    Voltar
  </a>
</nav>

<div class="stats-bar" id="statsBar" style="display:none">
  <div class="stat-chip">Nós<strong id="statNodes">0</strong></div>
  <div class="stat-chip">Links<strong id="statLinks">0</strong></div>
  <div class="stat-chip">Upstreams diretos<strong id="statDirect">0</strong></div>
</div>

<div class="toolbar">
  <button class="tb-btn" onclick="resetZoom()">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 18 0 9 9 0 0 0-18 0"/><path d="M12 8v4l3 3"/></svg>
    Centralizar
  </button>
  <button class="tb-btn" onclick="loadGraph()">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
    Atualizar
  </button>
  <button class="tb-btn" id="btnIPv6" onclick="toggleIPv6()">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 9h6M9 12h6M9 15h4"/></svg>
    <span id="ipv6label">Só IPv4</span>
  </button>
</div>

<div class="legend">
  <div class="leg-item"><div class="leg-dot" style="background:#FF6600"></div>AS265019 NexTelecom</div>
  <div class="leg-item"><div class="leg-dot" style="background:#2978FF"></div>Upstreams diretos (transit)</div>
  <div class="leg-item"><div class="leg-dot" style="background:#7040C0"></div>Tier-2 (upstreams dos upstreams)</div>
  <div class="leg-item" style="margin-top:4px;border-top:1px solid rgba(255,255,255,0.06);padding-top:6px">
    <svg width="30" height="10" viewBox="0 0 30 10"><line x1="0" y1="5" x2="24" y2="5" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" marker-end="url(#al)"/><defs><marker id="al" viewBox="0 -4 8 8" refX="8" refY="0" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,-4L8,0L0,4" fill="rgba(255,255,255,0.25)"/></marker></defs></svg>
    <span style="font-size:10px">propagação de rota →</span>
  </div>
</div>

<div class="info-panel" id="infoPanel">
  <button class="info-close" onclick="document.getElementById('infoPanel').classList.remove('show')">✕</button>
  <div class="info-title" id="iAsn">—</div>
  <div class="info-name" id="iName">—</div>
  <div id="iBadge"></div>
  <div style="margin-top:10px">
    <div class="info-row"><span class="info-key">País</span><span class="info-val" id="iCountry">—</span></div>
    <div class="info-row"><span class="info-key">Descrição</span><span class="info-val" id="iDesc">—</span></div>
    <div class="info-row"><span class="info-key">Nível</span><span class="info-val" id="iLevel">—</span></div>
    <div class="info-row">
      <span class="info-key">BGP.he.net</span>
      <span class="info-val"><a id="iLink" href="#" target="_blank" style="color:#2978FF;font-size:11px">Ver detalhes ↗</a></span>
    </div>
  </div>
</div>

<div class="loading" id="loading">
  <div class="spinner"></div>
  <div class="loading-text" id="loadingText">Consultando BGPView API…</div>
</div>

<div class="error-box" id="errorBox"></div>

<svg id="graph"></svg>

<script src="https://d3js.org/d3.v7.min.js"></script>
<script>
// Auth
const token = localStorage.getItem('netops_token');
if (!token) { window.location.href = '/login'; }
else {
  fetch('/api/auth/me', {headers:{Authorization:'Bearer '+token}})
    .then(r=>r.json()).then(d=>{if(!d.ok){localStorage.clear();window.location.href='/login';}})
    .catch(()=>{localStorage.clear();window.location.href='/login';});
}

const ROOT_ASN = 265019;
const COLORS = { 0:'#FF6600', 1:'#2978FF', 2:'#7040C0' };
const LEVEL_LABELS = { 0:'Origem — NexTelecom', 1:'Upstream direto (transit)', 2:'Tier-2 upstream' };

let useIPv6 = false;
let svgZoom, svgSel, gSel, simulation;

function toggleIPv6() {
  useIPv6 = !useIPv6;
  document.getElementById('ipv6label').textContent = useIPv6 ? 'IPv4 + IPv6' : 'Só IPv4';
  loadGraph();
}

async function fetchJson(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(`HTTP ${r.status} — ${url}`);
  const j = await r.json();
  if (j.status !== 'ok') throw new Error('API error: ' + (j.message || 'unknown'));
  return j.data;
}

function upKey(d) { return useIPv6 ? 'ipv6_upstreams' : 'ipv4_upstreams'; }

async function loadGraph() {
  const loading = document.getElementById('loading');
  const errBox  = document.getElementById('errorBox');
  loading.classList.remove('hidden');
  errBox.classList.remove('show');
  document.getElementById('statsBar').style.display = 'none';
  document.getElementById('infoPanel').classList.remove('show');

  try {
    document.getElementById('loadingText').textContent = 'Buscando info do AS265019…';
    const rootData = await fetchJson(`/api/bgp/asn/${ROOT_ASN}`);

    document.getElementById('loadingText').textContent = 'Buscando upstreams diretos…';
    const upData = await fetchJson(`/api/bgp/asn/${ROOT_ASN}/upstreams?minPower=100&limit=8&exclude=6939`);
    const l1list = upData[upKey()] || [];

    document.getElementById('loadingText').textContent = `Buscando tier-2 (${l1list.length} upstreams)…`;
    const l2results = await Promise.allSettled(
      l1list.map(u => fetchJson(`/api/bgp/asn/${u.asn}/upstreams?minPower=50&limit=6`))
    );

    // Build graph
    const nodeMap = new Map();
    const links = [];
    const linkSet = new Set();

    const addNode = (asn, name, country, desc, level) => {
      if (!nodeMap.has(asn)) nodeMap.set(asn, {id:asn, name:(name||`AS${asn}`).substring(0,28), country, desc, level});
    };
    const addLink = (src, tgt) => {
      const k = `${src}→${tgt}`;
      if (!linkSet.has(k)) { linkSet.add(k); links.push({source:src, target:tgt}); }
    };

    // Level 0
    addNode(ROOT_ASN, rootData.name, rootData.country_code, rootData.description_short, 0);

    // Level 1
    for (const u of l1list) {
      addNode(u.asn, u.name, u.country_code, u.description, 1);
      addLink(ROOT_ASN, u.asn);
    }

    // Level 2
    l2results.forEach((res, i) => {
      if (res.status !== 'fulfilled') return;
      const l1asn = l1list[i].asn;
      const tier2 = res.value[upKey()] || [];
      for (const u2 of tier2) {
        if (u2.asn === ROOT_ASN) continue;
        addNode(u2.asn, u2.name, u2.country_code, u2.description, 2);
        addLink(l1asn, u2.asn);
      }
    });

    const nodes = Array.from(nodeMap.values());
    document.getElementById('statNodes').textContent  = nodes.length;
    document.getElementById('statLinks').textContent  = links.length;
    document.getElementById('statDirect').textContent = l1list.length;
    document.getElementById('statsBar').style.display = 'flex';

    renderGraph(nodes, links);
  } catch(e) {
    console.error(e);
    errBox.textContent = 'Erro ao consultar API: ' + e.message;
    errBox.classList.add('show');
  } finally {
    loading.classList.add('hidden');
  }
}

function renderGraph(nodes, links) {
  const svg = d3.select('#graph');
  svg.selectAll('*').remove();

  const W = window.innerWidth;
  const H = window.innerHeight - 56;
  svg.attr('width', W).attr('height', H);

  // Zoom setup
  svgZoom = d3.zoom().scaleExtent([0.15, 4]).on('zoom', e => {
    gSel.attr('transform', e.transform);
  });
  svgSel = svg;
  svg.call(svgZoom);

  gSel = svg.append('g');

  // Arrow marker
  const defs = svg.append('defs');
  [0, 1, 2].forEach(lvl => {
    defs.append('marker')
      .attr('id', `arr${lvl}`)
      .attr('viewBox', '0 -5 10 10')
      .attr('refX', 30)
      .attr('refY', 0)
      .attr('markerWidth', 5)
      .attr('markerHeight', 5)
      .attr('orient', 'auto')
      .append('path')
      .attr('d', 'M0,-5L10,0L0,5')
      .attr('fill', COLORS[lvl] + '60');
  });

  // X positions by level (left=origin, right=tier2)
  const xMap = { 0: W*0.12, 1: W*0.45, 2: W*0.80 };

  // Links layer
  const linkSel = gSel.append('g').selectAll('line').data(links).join('line')
    .attr('stroke', d => {
      const src = nodes.find(n => n.id === (d.source.id ?? d.source));
      return COLORS[(src?.level ?? 0)] + '40';
    })
    .attr('stroke-width', 1.2)
    .attr('marker-end', d => {
      const src = nodes.find(n => n.id === (d.source.id ?? d.source));
      return `url(#arr${src?.level ?? 0})`;
    });

  // Node groups
  const nodeSel = gSel.append('g').selectAll('g').data(nodes).join('g')
    .attr('cursor', 'pointer')
    .on('click', (e, d) => showInfo(d))
    .call(d3.drag()
      .on('start', (e, d) => { if (!e.active) simulation.alphaTarget(0.1).restart(); d.fx = d.x; d.fy = d.y; })
      .on('drag',  (e, d) => { d.fx = e.x; d.fy = e.y; })
      .on('end',   (e, d) => { if (!e.active) simulation.alphaTarget(0); d.fx = e.x; d.fy = e.y; })
    );

  // Glow filter
  const filt = defs.append('filter').attr('id','glow');
  filt.append('feGaussianBlur').attr('stdDeviation','3').attr('result','blur');
  const feMerge = filt.append('feMerge');
  feMerge.append('feMergeNode').attr('in','blur');
  feMerge.append('feMergeNode').attr('in','SourceGraphic');

  // Ellipse
  nodeSel.append('ellipse')
    .attr('rx', d => d.level === 0 ? 62 : 52)
    .attr('ry', d => d.level === 0 ? 26 : 20)
    .attr('fill', d => COLORS[d.level] + (d.level === 0 ? '25' : '18'))
    .attr('stroke', d => COLORS[d.level])
    .attr('stroke-width', d => d.level === 0 ? 2 : 1.2)
    .attr('filter', d => d.level === 0 ? 'url(#glow)' : null);

  // ASN label
  nodeSel.append('text')
    .attr('dy', d => d.level === 0 ? -6 : -5)
    .attr('text-anchor', 'middle')
    .attr('font-size', d => d.level === 0 ? 12 : 10)
    .attr('font-weight', 700)
    .attr('font-family', "'Plus Jakarta Sans', sans-serif")
    .attr('fill', d => COLORS[d.level])
    .text(d => `AS${d.id}`);

  // Name label
  nodeSel.append('text')
    .attr('dy', d => d.level === 0 ? 11 : 9)
    .attr('text-anchor', 'middle')
    .attr('font-size', d => d.level === 0 ? 10 : 8)
    .attr('font-family', "'Plus Jakarta Sans', sans-serif")
    .attr('fill', 'rgba(255,255,255,0.55)')
    .text(d => d.name.substring(0, d.level === 0 ? 18 : 13));

  // Simulation — alphaDecay alto para convergir rápido e parar
  simulation = d3.forceSimulation(nodes)
    .alphaDecay(0.06)
    .force('link',    d3.forceLink(links).id(d => d.id).distance(130).strength(0.25))
    .force('charge',  d3.forceManyBody().strength(-350))
    .force('x',       d3.forceX(d => xMap[d.level]).strength(1.0))
    .force('y',       d3.forceY(H / 2).strength(0.04))
    .force('collide', d3.forceCollide(58));

  simulation.on('tick', () => {
    linkSel
      .attr('x1', d => d.source.x).attr('y1', d => d.source.y)
      .attr('x2', d => d.target.x).attr('y2', d => d.target.y);
    nodeSel.attr('transform', d => `translate(${d.x},${d.y})`);
  });

  // Ao terminar: congela os nós e centraliza
  simulation.on('end', () => {
    nodes.forEach(n => { n.fx = n.x; n.fy = n.y; });
    const xs = nodes.map(n => n.x), ys = nodes.map(n => n.y);
    const mx = (Math.min(...xs)+Math.max(...xs))/2;
    const my = (Math.min(...ys)+Math.max(...ys))/2;
    svgSel.transition().duration(800).call(
      svgZoom.transform,
      d3.zoomIdentity.translate(W/2 - mx, H/2 - my)
    );
  });

  // Fallback: para forçosamente após 12s caso não convirja
  setTimeout(() => {
    simulation.stop();
    nodes.forEach(n => { if (!n.fx) { n.fx = n.x; n.fy = n.y; } });
  }, 12000);
}

function resetZoom() {
  if (svgSel && svgZoom) {
    svgSel.transition().duration(500).call(svgZoom.transform, d3.zoomIdentity);
  }
}

function showInfo(d) {
  document.getElementById('iAsn').textContent    = `AS${d.id}`;
  document.getElementById('iName').textContent   = d.name;
  document.getElementById('iCountry').textContent = d.country || '—';
  document.getElementById('iDesc').textContent   = d.desc || '—';
  document.getElementById('iLevel').textContent  = LEVEL_LABELS[d.level];
  document.getElementById('iLink').href = `https://bgp.he.net/AS${d.id}`;

  const badge = document.getElementById('iBadge');
  const bColors = { 0:'#FF6600', 1:'#2978FF', 2:'#7040C0' };
  badge.innerHTML = `<span class="info-badge" style="background:${bColors[d.level]}22;color:${bColors[d.level]};border:1px solid ${bColors[d.level]}44">${LEVEL_LABELS[d.level]}</span>`;

  document.getElementById('infoPanel').classList.add('show');
}

// Handle resize
window.addEventListener('resize', () => {
  const svg = document.getElementById('graph');
  svg.setAttribute('width', window.innerWidth);
  svg.setAttribute('height', window.innerHeight - 56);
});

// Load on start
loadGraph();
</script>
</body>
</html>
