<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mapa de Rede — 1º Andar | NEX NetOps</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#1a1a1a;color:#fff;height:100vh;overflow:hidden;display:flex;flex-direction:column}
.topbar{background:#111;border-bottom:0.5px solid #333;padding:8px 16px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;z-index:100}
.topbar h1{font-size:14px;font-weight:600;color:#fff}
.topbar p{font-size:11px;color:#888}
.topbar-right{display:flex;align-items:center;gap:8px}
.btn{font-size:11px;font-weight:500;padding:5px 12px;border-radius:5px;border:0.5px solid #333;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:5px;background:transparent;color:#888}
.btn:hover{color:#fff;border-color:#666}
.btn-red{color:#f08080;border-color:#6b2b2b}
.btn-red:hover{background:#2d1414;border-color:#f08080}
.filters{background:#111;border-bottom:0.5px solid #222;padding:6px 16px;display:flex;align-items:center;gap:8px;flex-shrink:0}
.filter-label{font-size:11px;color:#555;margin-right:4px}
.filter-btn{font-size:11px;font-weight:500;padding:3px 10px;border-radius:20px;border:0.5px solid #333;background:transparent;color:#666;cursor:pointer;display:flex;align-items:center;gap:5px;transition:all 0.15s}
.filter-btn.active{color:#fff}
.f-all.active{background:#333;border-color:#555}
.f-rede.active{background:#1a3a5c;border-color:#2e75b6;color:#b5d4f4}
.f-cam.active{background:#1a2e4a;border-color:#2980b9;color:#aed6f1}
.f-ap.active{background:#1a3a1a;border-color:#27ae60;color:#a9dfbf}
.f-esp.active{background:#4a3000;border-color:#d4ac0d;color:#fdebd0}
.dot-mini{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.stats{margin-left:auto;display:flex;gap:12px}
.stat{font-size:11px;color:#555;display:flex;align-items:center;gap:5px}
.stat span{color:#888;font-weight:500}
.map-container{flex:1;overflow:hidden;position:relative;cursor:grab}
.map-container.grabbing{cursor:grabbing}
.map-inner{position:absolute;transform-origin:0 0}
.map-img{display:block;user-select:none;pointer-events:none}
.point{position:absolute;transform:translate(-50%,-50%);cursor:pointer;transition:transform 0.1s;z-index:10}
.point:hover{transform:translate(-50%,-50%) scale(1.4);z-index:50}
.point-dot{width:30px;height:30px;border-radius:50%;border:2px solid rgba(255,255,255,0.8);display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#fff;box-shadow:0 2px 8px rgba(0,0,0,0.6);transition:box-shadow 0.1s}
.point:hover .point-dot{box-shadow:0 0 0 3px rgba(255,255,255,0.3),0 2px 8px rgba(0,0,0,0.6)}
.point.rede .point-dot{background:#c0392b}
.point.cam  .point-dot{background:#2980b9}
.point.ap   .point-dot{background:#27ae60}
.point.esp  .point-dot{background:#d4ac0d}
.point.hidden{display:none}
.tooltip{display:none;position:fixed;background:#111;border:0.5px solid #3a3a3a;border-radius:10px;padding:12px 14px;font-size:12px;z-index:200;pointer-events:none;min-width:200px;box-shadow:0 8px 24px rgba(0,0,0,0.8)}
.tooltip.visible{display:block}
.tt-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.tt-label{font-weight:600;font-size:13px;color:#fff}
.tt-badge{font-size:10px;font-weight:600;padding:2px 8px;border-radius:4px}
.badge-rede{background:#1a3a5c;color:#b5d4f4}
.badge-cam{background:#1a2e4a;color:#aed6f1}
.badge-ap{background:#1a3a1a;color:#a9dfbf}
.badge-esp{background:#4a3000;color:#fdebd0}
.tt-divider{height:0.5px;background:#2a2a2a;margin-bottom:8px}
.tt-row{display:flex;justify-content:space-between;gap:16px;margin-bottom:4px}
.tt-row:last-child{margin-bottom:0}
.tt-key{color:#555;font-size:11px}
.tt-val{color:#bbb;font-size:11px;font-weight:500;text-align:right}
.tt-etiq{color:#666;font-size:10px;font-family:monospace;text-align:right;word-break:break-all}
.zoom-controls{position:absolute;bottom:16px;right:16px;display:flex;flex-direction:column;gap:4px;z-index:100}
.zoom-btn{width:30px;height:30px;background:#1a1a1a;border:0.5px solid #333;border-radius:6px;color:#aaa;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1}
.zoom-btn:hover{background:#222;color:#fff}
.zoom-level{background:#1a1a1a;border:0.5px solid #333;border-radius:6px;color:#666;font-size:10px;text-align:center;padding:4px 0;font-weight:500}
.info-bar{position:absolute;bottom:16px;left:16px;background:rgba(17,17,17,0.85);border:0.5px solid #2a2a2a;border-radius:8px;padding:6px 12px;font-size:10px;color:#555;z-index:100;backdrop-filter:blur(4px)}
</style>
</head>
<body>

<div class="topbar">
  <div>
    <h1>Mapa de Rede — Escritório PQS · 1º Andar</h1>
    <p>NEX Telecom · UBNT-SW-03 (48p) · UBNT-SW-04 (24p)</p>
  </div>
  <div class="topbar-right">
    <a href="/" class="btn">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>Portal
    </a>
    <a href="/rede/escritorio-pqs-1andar/" class="btn">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>Dashboard
    </a>
    <a href="/logout" class="btn btn-red" onclick="return doLogout()">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>Sair
    </a>
  </div>
</div>

<div class="filters">
  <span class="filter-label">Filtrar:</span>
  <button class="filter-btn f-all active" onclick="setFilter('all')"><span class="dot-mini" style="background:#666"></span>Todos</button>
  <button class="filter-btn f-rede" onclick="setFilter('rede')"><span class="dot-mini" style="background:#c0392b"></span>Pontos de rede</button>
  <button class="filter-btn f-cam" onclick="setFilter('cam')"><span class="dot-mini" style="background:#2980b9"></span>Câmeras IP</button>
  <button class="filter-btn f-ap" onclick="setFilter('ap')"><span class="dot-mini" style="background:#27ae60"></span>Access points</button>
  <button class="filter-btn f-esp" onclick="setFilter('esp')"><span class="dot-mini" style="background:#d4ac0d"></span>Especiais</button>
  <div class="stats">
    <span class="stat"><span id="cnt-rede">0</span> rede</span>
    <span class="stat"><span id="cnt-cam">0</span> câmeras</span>
    <span class="stat"><span id="cnt-ap">0</span> APs</span>
    <span class="stat"><span id="cnt-esp">0</span> especiais</span>
  </div>
</div>

<div class="map-container" id="mapContainer">
  <div class="map-inner" id="mapInner">
    <img src="mapa_rede_1andar.png" class="map-img" id="mapImg" draggable="false">
    <div id="pointsLayer"></div>
  </div>
</div>

<div class="zoom-controls">
  <button class="zoom-btn" onclick="zoom(0.2)">+</button>
  <div class="zoom-level" id="zoomLevel">100%</div>
  <button class="zoom-btn" onclick="zoom(-0.2)">−</button>
  <button class="zoom-btn" onclick="resetView()" title="Resetar">⌂</button>
</div>

<div class="info-bar">Scroll = zoom · Arrastar = mover · Hover = detalhes</div>
<div class="tooltip" id="tooltip"></div>

  ["CA14-PP03-DESCANSO",72.482,63.419,"cam","PP-03","14","UBNT-SW-04","Gi0/14","Câmera 14"],
  ["CA15-PP03-DESCANSO",83.522,64.343,"cam","PP-03","15","UBNT-SW-04","Gi0/15","Câmera 15"],
  ["CA16-PP03-REUNIAO",64.288,55.301,"cam","PP-03","16","UBNT-SW-04","Gi0/16","Câmera 16"],
  ["CA17-PP03-REUNIAO",65.748,39.255,"cam","PP-03","17","UBNT-SW-04","Gi0/17","Câmera 17"],
  ["CA18-PP03-ENTRADA",39.544,89.717,"cam","PP-03","18","UBNT-SW-04","Gi0/18","Câmera 18"],
  ["PT15-PP03-AUDITORIO",22.609,57.338,"rede","PP-03","15","UBNT-SW-04","Gi0/15","Auditório"],
];

var TIPO_LABEL = {rede:"Ponto de rede",cam:"Câmera IP",ap:"Access Point",esp:"Dispositivo especial"};
var TIPO_BADGE = {rede:"badge-rede",cam:"badge-cam",ap:"badge-ap",esp:"badge-esp"};

// Render
var layer = document.getElementById('pointsLayer');
var tooltip = document.getElementById('tooltip');

function renderPoints() {
  layer.innerHTML = '';
  var cnts = {rede:0,cam:0,ap:0,esp:0};
  PONTOS.forEach(function(p) {
    var label=p[0],xpct=p[1],ypct=p[2],tipo=p[3];
    cnts[tipo] = (cnts[tipo]||0)+1;
    var div = document.createElement('div');
    div.className = 'point ' + tipo;
    div.style.left = (xpct/100*IMG_W)+'px';
    div.style.top  = (ypct/100*IMG_H)+'px';
    div.dataset.tipo = tipo;
    var dot = document.createElement('div');
    dot.className = 'point-dot';
    var short = label.match(/\d+/);
    dot.textContent = short ? short[0] : label.slice(0,3);
    div.appendChild(dot);
    div.addEventListener('mouseenter', function(e){showTip(e,p)});
    div.addEventListener('mouseleave', function(){tooltip.classList.remove('visible')});
    div.addEventListener('mousemove', moveTip);
    layer.appendChild(div);
  });
  document.getElementById('cnt-rede').textContent = cnts.rede||0;
  document.getElementById('cnt-cam').textContent  = cnts.cam||0;
  document.getElementById('cnt-ap').textContent   = cnts.ap||0;
  document.getElementById('cnt-esp').textContent  = cnts.esp||0;
}

function showTip(e,p) {
  var label=p[0],xp=p[1],yp=p[2],tipo=p[3],pp=p[4],porta=p[5],sw=p[6],swp=p[7],sala=p[8];
  var ppn = pp.replace('PP-','');
  var swn = sw.replace('UBNT-SW-0','');
  var swpn = swp.replace('Gi0/','');
  var etiq = 'PP'+ppn.padStart(2,'0')+'-P'+porta.padStart(2,'0')+'-SW0'+swn+'-P'+swpn.padStart(2,'0');
  tooltip.innerHTML =
    '<div class="tt-header">' +
      '<span class="tt-label">'+label+'</span>' +
      '<span class="tt-badge '+TIPO_BADGE[tipo]+'">'+TIPO_LABEL[tipo]+'</span>' +
    '</div>' +
    '<div class="tt-divider"></div>' +
    '<div class="tt-row"><span class="tt-key">Sala</span><span class="tt-val">'+sala+'</span></div>' +
    '<div class="tt-row"><span class="tt-key">Patch Panel</span><span class="tt-val">'+pp+' · Porta '+porta.padStart(2,'0')+'</span></div>' +
    '<div class="tt-row"><span class="tt-key">Switch</span><span class="tt-val">'+sw+'</span></div>' +
    '<div class="tt-row"><span class="tt-key">Porta SW</span><span class="tt-val">'+swp+'</span></div>' +
    '<div class="tt-row"><span class="tt-key">Etiqueta</span><span class="tt-etiq">'+etiq+'</span></div>';
  tooltip.classList.add('visible');
  moveTip(e);
}
function moveTip(e) {
  var x=e.clientX+16, y=e.clientY-10;
  if(x+220>window.innerWidth) x=e.clientX-236;
  if(y+160>window.innerHeight) y=e.clientY-160;
  tooltip.style.left=x+'px'; tooltip.style.top=y+'px';
}

// Filtro
function setFilter(f) {
  document.querySelectorAll('.filter-btn').forEach(function(b){b.classList.remove('active')});
  document.querySelector('.f-'+f).classList.add('active');
  document.querySelectorAll('.point').forEach(function(pt){
    pt.classList.toggle('hidden', f!=='all' && pt.dataset.tipo!==f);
  });
}

// Pan + Zoom
var container=document.getElementById('mapContainer');
var inner=document.getElementById('mapInner');
var scale=1,tx=0,ty=0,dragging=false,startX,startY,startTx,startTy;

function applyT(){
  inner.style.transform='translate('+tx+'px,'+ty+'px) scale('+scale+')';
  document.getElementById('zoomLevel').textContent=Math.round(scale*100)+'%';
}
function zoom(d,cx,cy){
  var rect=container.getBoundingClientRect();
  var mx=(cx!==undefined?cx:rect.left+rect.width/2)-rect.left;
  var my=(cy!==undefined?cy:rect.top+rect.height/2)-rect.top;
  var ns=Math.max(0.1,Math.min(5,scale+d));
  var r=ns/scale;
  tx=mx-r*(mx-tx); ty=my-r*(my-ty); scale=ns;
  applyT();
}
function resetView(){
  var rect=container.getBoundingClientRect();
  scale=Math.min(rect.width/IMG_W,rect.height/IMG_H)*0.97;
  tx=(rect.width-IMG_W*scale)/2;
  ty=(rect.height-IMG_H*scale)/2;
  applyT();
}
container.addEventListener('wheel',function(e){e.preventDefault();zoom(e.deltaY>0?-0.12:0.12,e.clientX,e.clientY)},{passive:false});
container.addEventListener('mousedown',function(e){dragging=true;startX=e.clientX;startY=e.clientY;startTx=tx;startTy=ty;container.classList.add('grabbing')});
document.addEventListener('mousemove',function(e){if(!dragging)return;tx=startTx+(e.clientX-startX);ty=startTy+(e.clientY-startY);applyT()});
document.addEventListener('mouseup',function(){dragging=false;container.classList.remove('grabbing')});

document.getElementById('mapImg').onload=function(){renderPoints();resetView()};
if(document.getElementById('mapImg').complete){renderPoints();resetView()}

function doLogout(){
  fetch('/logout',{headers:{'Authorization':'Basic '+btoa('logout:logout')}}).finally(function(){window.location.href='/logout'});
  return false;
}
</script>
</body>
</html>
